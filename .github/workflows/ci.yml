name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.2-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Verify test database isolation
        run: |
          test -f phpunit.xml
          test "${DB_CONNECTION:-sqlite}" = "sqlite"
          test -z "${DB_URL:-}"
          test -f database/database.sqlite
      - name: Run PHPUnit tests
        run: php artisan test

  backend-mysql:
    name: Backend finance, concurrency and RBAC (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: retention_test
          MYSQL_ROOT_PASSWORD: retention_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pretention_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: retention_test
      DB_USERNAME: root
      DB_PASSWORD: retention_ci
      DB_URL: ""
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: |
          cp .env.example .env
          php artisan key:generate --force
      - name: Verify isolated MySQL test target
        run: |
          test -f phpunit.xml
          test "$APP_ENV" = "testing"
          test "$DB_CONNECTION" = "mysql"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "retention_test"
          test -z "$DB_URL"
      - name: Test backend on MySQL
        run: php artisan test

  frontend:
    name: Frontend React and Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontEnd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontEnd/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend permission tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: npm run build

  deployment-safeguards:
    name: Deployment safeguards and Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployment failure paths without network access
        run: python -m unittest discover -s scripts/ops/tests -v
      - name: Validate GitHub Actions configuration
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Build production image without production secrets
        run: docker build --build-arg RELEASE_SHA="$GITHUB_SHA" -t billing-ci:test backend
      - name: Verify container over HTTP on an isolated database
        run: python scripts/ops/smoke_container.py billing-ci:test "$GITHUB_SHA"
