name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character SHA on main with successful CI
        required: true
        type: string
      confirmation:
        description: Type DEPLOY to approve this delivery (no database migration)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Controlled production delivery
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    steps:
      # Execute trusted deployment tooling from main, never scripts from an input ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and deliver the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.commit_sha }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
          RENDER_FRONTEND_SERVICE_ID: ${{ vars.RENDER_FRONTEND_SERVICE_ID }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          REQUIRE_PRODUCTION_REVIEW: ${{ vars.REQUIRE_PRODUCTION_REVIEW || 'true' }}
        run: python scripts/ops/deploy.py
