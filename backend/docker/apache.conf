<VirtualHost *:${PORT}>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    <Directory /app>
        AllowOverride None
        Require all denied
    </Directory>
    # Preserve Bearer tokens through Laravel's existing public/.htaccess.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    ErrorLog /proc/self/fd/2
    LogFormat "%h %t \"%m %U %H\" %>s %b" billing
    CustomLog /proc/self/fd/1 billing
</VirtualHost>
ServerTokens Prod
ServerSignature Off
Timeout 60
KeepAliveTimeout 2
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
